<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Корзина</title>
</head>
<body>
<h1 style="text-align:center;">Моя корзина</h1>

<table>
    <thead>
    <tr>
        <th>Название</th>
        <th>Цена</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <!-- Перебор товаров -->
    <tr th:each="item : ${surfs}">
        <td th:text="${item.getTypeSurf()}">Название товара</td>
        <td th:text="${item.getPrice()} + ' €'">Цена</td>
        <td class="actions">
            <form th:action="@{/order}" method="post" style="display:inline;">
                <input type="hidden" th:name="itemId" th:value="${item.id}" />
                <button type="submit">Заказать</button>
            </form>
            <form th:action="@{/cart/delete}" method="post" style="display:inline;">
                <input type="hidden" th:name="itemId" th:value="${item.id}" />
                <button type="submit">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
    <tfoot>
    <tr>
        <td class="total" colspan="3">
            Общая сумма: <span th:text="${#numbers.formatDecimal(sum, 1, 'POINT', 2, 'NONE')} + ' €'"></span>
        </td>
    </tr>
    </tfoot>
</table>

</body>
</html>
